services:
  mysql:
    image: mysql:8.4
    container_name: decodulce-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: decodulce
      MYSQL_USER: decodulce
      MYSQL_PASSWORD: decodulce
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - decodulce_mysql:/var/lib/mysql

volumes:
  decodulce_mysql: