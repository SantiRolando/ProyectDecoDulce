spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/decodulce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:decodulce}
spring.datasource.password=${DB_PASSWORD:decodulce}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.name=${ADMIN_NAME:Administrador Deco Dulce}

server.port=8080
app.uploads.directory=${UPLOADS_DIRECTORY:uploads/cakes}
app.transfer-proofs.directory=${TRANSFER_PROOFS_DIRECTORY:uploads/transfer-proofs}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
